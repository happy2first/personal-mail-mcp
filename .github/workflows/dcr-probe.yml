name: Cloudflare MCP OAuth exact metadata probe

on:
  push:
    paths:
      - ".github/workflows/dcr-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact resource metadata URL
        shell: bash
        run: |
          for url in             "https://personal-mail-mcp.esmeknight.workers.dev/.well-known/cloudflare-access-protected-resource/mcp"             "https://personal-mail-mcp.esmeknight.workers.dev/.well-known/oauth-protected-resource/mcp"
          do
            echo "=== $url ==="
            curl --silent --show-error --dump-header - --output metadata.json "$url"
            jq . metadata.json 2>/dev/null || head -c 2000 metadata.json
            echo
          done
