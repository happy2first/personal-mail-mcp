name: Cloudflare Managed OAuth DCR probe

on:
  push:
    paths:
      - ".github/workflows/dcr-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe dynamic client registration
        shell: bash
        run: |
          payload=$(jq -n '{
            redirect_uris: ["https://oauth-callbacks.cloudflareaccess.com/cdn-cgi/access/outbound-oauth-callback"],
            token_endpoint_auth_method: "none",
            grant_types: ["authorization_code"],
            response_types: ["code"],
            resource: "https://personal-mail-mcp.esmeknight.workers.dev/mcp"
          }')
          status=$(curl --silent --show-error             --output response.json             --write-out "%{http_code}"             --request POST             --header "Content-Type: application/json"             --data "$payload"             "https://liao8top.cloudflareaccess.com/cdn-cgi/access/oauth/registration")
          echo "HTTP_STATUS=$status"
          jq '{
            error,
            error_description,
            message,
            client_id_present: (.client_id != null),
            redirect_uris,
            token_endpoint_auth_method
          }' response.json
          test "$status" -ge 200
          test "$status" -lt 300
